
# LLM Guardrails Gateway Policy

blocked_topics:
  - "medical advice"
  - "legal advice"
  - "competitor names"
  - "financial investment advice"

blocked_keywords:
  - "ignore previous instructions"
  - "ignore all instructions"
  - "reveal the system prompt"
  - "developer mode"
  - "jailbreak"

require_disclaimer: true
disclaimer_text: "Note: This is general information, not professional advice."

max_input_length: 2000
max_output_length: 3000

# PII handling
allow_pii_in_input: false
pii_action: "block"

# Prompt-injection handling
prompt_injection:
  enabled: true
  action: "block"

# Output safety
output_guardrails:
  enabled: true
  block_secrets: true
  block_unsafe_output: true

# Resource limits
rate_limit:
  enabled: true
  requests_per_minute: 30

